<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested</title>
</head>
<body>
    <h2>My favorite Subjects</h2>
    <ul>
        <li>Computer Science
            <ul type="circle">
                <li>Programming
                    <ul type="square">
                        <li>Python</li>
                        <li>Java</li>
                        <li>C++</li>
                    </ul>
                </li>
                <li>Web Technologies
                    <ul type="square">
                        <li>HTML</li>
                        <li>CSS</li>
                    </ul>
                </li>
            </ul>
        </li>
        <li>Mathematics
            <ul type="circle">
                <li>Algebra
                    <ul type="square">
                        <li>Linear Algebra</li>
                        <li>Matrices</li>
                    </ul>
                </li>
                <li>Calculus
                    <ul type="square">
                        <li>Differentiation</li>
                        <li>Integration</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</body>
</html>
